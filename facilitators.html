<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet our verified network of yoga masters, clay artisans, organic nutritionists, and nature trackers in Kerala. Read bios and schedules.">
  <title>Facilitator Network - Peepal Tree</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main style="min-height:75vh; padding-top: calc(var(--header-height) + var(--space-xl));">
    <div id="facilitators-renderer" class="container">
      <!-- Injected dynamically via JS below -->
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const db = window.PeepalDatabase;
      const store = window.PeepalStore;
      const renderer = document.getElementById("facilitators-renderer");
      
      const urlParams = new URLSearchParams(window.location.search);
      const activeId = urlParams.get("id");

      function renderFacilitators() {
        if (!db || !renderer) return;

        if (activeId) {
          // 1. Detailed Facilitator Profile View
          const fac = db.Facilitators.find(f => f.id === activeId);
          if (!fac) {
            renderer.innerHTML = `<div style="text-align:center; padding:var(--space-xxl) 0;"><h2>Facilitator not found</h2><a href="facilitators.html" class="btn btn-primary">Return to Network</a></div>`;
            return;
          }

          const exps = db.Experiences.filter(e => e.facilitatorId === activeId);
          const retreats = db.Retreats.filter(r => r.facilitatorId === activeId);

          renderer.innerHTML = `
            <div class="facilitator-detail-card fade-in-section is-visible" id="fac-profile-${fac.id}">
              <img src="${fac.photo}" alt="${fac.name}" class="facilitator-avatar-large">
              
              <div style="display:flex; flex-direction:column; justify-content:space-between;">
                <div>
                  <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:var(--space-sm);">
                    <div>
                      <span style="font-size:0.75rem; color:var(--color-sage); font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">Verified Slow Guide &bull; ${fac.expertise}</span>
                      <h1 style="font-size:2rem; margin:var(--space-xs) 0 var(--space-sm); font-family:var(--font-heading); color:var(--color-forest);">${fac.name}</h1>
                    </div>
                    <button class="btn btn-terracotta btn-small" id="follow-fac-btn" data-id="${fac.id}">Follow Facilitator</button>
                  </div>

                  <p style="color:var(--color-slate); font-size:1rem; line-height:1.7; margin-bottom:var(--space-lg);">${fac.bio}</p>
                  
                  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:var(--space-md); border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); padding:var(--space-md) 0; margin-bottom:var(--space-lg);">
                    <div>
                      <span style="font-size:0.75rem; color:var(--color-slate); display:block;">Trust Score</span>
                      <strong style="font-size:1.2rem; color:var(--color-forest);">⭐ ${fac.rating} / 5.0</strong>
                    </div>
                    <div>
                      <span style="font-size:0.75rem; color:var(--color-slate); display:block;">Followers</span>
                      <strong style="font-size:1.2rem; color:var(--color-forest);" id="follower-counter">${fac.followersCount}</strong>
                    </div>
                    <div>
                      <span style="font-size:0.75rem; color:var(--color-slate); display:block;">Verification</span>
                      <strong style="font-size:0.9rem; color:var(--color-sage); text-transform:uppercase;">${fac.verificationStatus}</strong>
                    </div>
                  </div>
                </div>

                <div style="margin-top:auto;">
                  <span style="font-size:0.75rem; color:var(--color-slate); display:block;">Social Coordinates</span>
                  <p style="font-size:0.85rem; color:var(--color-forest); font-weight:600; margin:0;">
                    ${fac.socialLinks.instagram ? `Instagram: <strong>${fac.socialLinks.instagram}</strong>` : ""}
                    ${fac.socialLinks.website ? ` | Web: <strong>${fac.socialLinks.website}</strong>` : ""}
                  </p>
                </div>
              </div>
            </div>

            <!-- Portfolio of Hosted items -->
            <section class="section-padding" style="margin-top:var(--space-xl);">
              <h2 style="font-family:var(--font-heading); margin-bottom:var(--space-lg); border-bottom:1px solid var(--color-border); padding-bottom:var(--space-xs);">Hosted Experiences & Retreats</h2>
              
              ${exps.length === 0 && retreats.length === 0 ? `
                <p style="color:var(--color-slate);">No upcoming scheduled sessions.</p>
              ` : `
                <div class="grid-3">
                  ${exps.map(item => `
                    <div class="card">
                      <div class="card-img-wrapper" style="aspect-ratio:16/10;">
                        <span class="card-badge">${item.category}</span>
                        <img src="${item.gallery[0]}" alt="${item.title}">
                      </div>
                      <div class="card-content">
                        <h3 class="card-title" style="font-size:1.15rem;"><a href="experiences.html?id=${item.id}">${item.title}</a></h3>
                        <p class="card-description" style="font-size:0.85rem; -webkit-line-clamp: 2;">${item.description}</p>
                        <div class="card-footer" style="padding-top:var(--space-sm);">
                          <div class="card-price" style="font-size:1rem;">₹${item.price.toLocaleString()}</div>
                          <button class="btn btn-terracotta btn-small booking-trigger-btn" data-type="experience" data-id="${item.id}">Book Seat</button>
                        </div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </section>

            <div style="text-align:center; padding-bottom:var(--space-xxl);">
              <a href="facilitators.html" class="btn btn-outline">&larr; Return to Network Directory</a>
            </div>
          `;

          // Increment follow count simulator
          let followed = false;
          const fBtn = document.getElementById("follow-fac-btn");
          const counterEl = document.getElementById("follower-counter");
          if (fBtn && counterEl) {
            fBtn.addEventListener("click", () => {
              if (!followed) {
                counterEl.innerText = fac.followersCount + 1;
                fBtn.innerText = "Following";
                fBtn.style.backgroundColor = "var(--color-forest)";
                window.PeepalComponents?.showToast(`You are now following ${fac.name}.`);
                followed = true;
              } else {
                counterEl.innerText = fac.followersCount;
                fBtn.innerText = "Follow Facilitator";
                fBtn.style.backgroundColor = "var(--color-terracotta)";
                window.PeepalComponents?.showToast(`Unfollowed ${fac.name}.`);
                followed = false;
              }
            });
          }

        } else {
          // 2. Hub Directory view
          renderer.innerHTML = `
            <div style="text-align:center; margin-bottom:var(--space-xxl);" class="fade-in-section is-visible">
              <span style="font-size:0.8rem; font-weight:700; color:var(--color-terracotta); text-transform:uppercase;">The Creator Network</span>
              <h1 style="margin:var(--space-xs) 0 var(--space-sm);">Verified Local Facilitators</h1>
              <p style="color:var(--color-slate); max-width:600px; margin:0 auto;">Earthy educators, wellness masters, and culinary leaders who co-create deep slow travel pathways.</p>
            </div>

            <div class="grid-3">
              ${db.Facilitators.map(item => `
                <div class="card fade-in-section is-visible" style="text-align:center; padding:var(--space-xl);" id="fac-card-${item.id}">
                  <img src="${item.photo}" alt="${item.name}" style="border-radius:50%; width:110px; height:110px; object-fit:cover; margin:0 auto var(--space-md);">
                  <span style="font-size:0.75rem; color:var(--color-sage); font-weight:700; text-transform:uppercase;">${item.expertise}</span>
                  <h3 style="font-size:1.25rem; margin:var(--space-xs) 0;" class="card-title">${item.name}</h3>
                  <p style="font-size:0.85rem; color:var(--color-slate); line-height:1.5; margin-bottom:var(--space-md); -webkit-line-clamp:3; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden;">${item.bio}</p>
                  <strong style="font-size:0.85rem; color:var(--color-forest); display:block; margin-bottom:var(--space-sm);">⭐ ${item.rating} &bull; ${item.followersCount} Followers</strong>
                  <a href="facilitators.html?id=${item.id}" class="btn btn-outline btn-small" style="margin-top:auto;" id="view-profile-${item.id}">Explore Portfolio</a>
                </div>
              `).join('')}
            </div>
          `;
        }
      }

      renderFacilitators();
    });
  </script>
</body>
</html>
