<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover premium multi-day wellness, yoga, and clinical stress-relief retreats in Kerala. Stays, Sattvic meals, and facilitator courses included.">
  <title>Slow Retreats & Wellness Sanctuaries - Peepal Tree</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main style="padding-top: calc(var(--header-height) + var(--space-xl));">
    <div class="container">
      
      <!-- Page Header -->
      <div style="margin-bottom: var(--space-xl);" class="fade-in-section is-visible">
        <span style="font-size:0.8rem; font-weight:700; color:var(--color-terracotta); text-transform:uppercase;">Fully-Bundled Experiences</span>
        <h1 style="margin: var(--space-xs) 0 var(--space-sm);">Immersive Mindful Retreats</h1>
        <p style="color:var(--color-slate); max-width:600px;">Multi-day stays that merge boutique nature cabins, daily organic nutrition matching, and private expert tutorials.</p>
      </div>

      <!-- Retreat List container -->
      <div id="retreats-dynamic-list" style="display:flex; flex-direction:column; gap:var(--space-xxl); min-height:400px;">
        <!-- Injected via JavaScript below -->
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const db = window.PeepalDatabase;
      const listContainer = document.getElementById("retreats-dynamic-list");

      // Load query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get("id");

      function renderRetreats() {
        if (!db || !listContainer) return;

        let list = db.Retreats;
        if (queryId) {
          list = list.filter(r => r.id === queryId);
        }

        listContainer.innerHTML = list.map(item => {
          const destName = db.Destinations.find(d => d.id === item.destinationId)?.name || item.destinationId;
          const propName = db.Properties.find(p => p.id === item.propertyId)?.name || item.propertyId;
          const fac = db.Facilitators.find(f => f.id === item.facilitatorId);

          return `
            <div class="fade-in-section is-visible" style="background-color:var(--color-coconut); border-radius:var(--radius-lg); border:1px solid var(--color-border); box-shadow:var(--shadow-md); overflow:hidden;" id="retreat-${item.id}">
              <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:0; flex-wrap:wrap;">
                <!-- Left Image/Gallery side -->
                <div style="position:relative; width:100%; height:100%; min-height:350px;">
                  <img src="${item.gallery[0]}" alt="${item.title}" style="width:100%; height:100%; object-fit:cover; border-radius:0;">
                  <div style="position:absolute; top:var(--space-lg); left:var(--space-lg); background-color:rgba(28,38,28,0.85); color:var(--color-sand-light); padding:0.4rem 1rem; border-radius:var(--radius-full); font-size:0.8rem; font-weight:700; backdrop-filter:blur(4px);">
                    📍 ${destName} &bull; ${item.durationDays} Days
                  </div>
                </div>

                <!-- Right Information details -->
                <div style="padding:var(--space-xl); display:flex; flex-direction:column; justify-content:space-between;">
                  <div>
                    <span style="font-size:0.75rem; color:var(--color-terracotta); font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">Upcoming Start: ${item.startDate}</span>
                    <h2 style="font-size:1.8rem; margin:var(--space-xs) 0 var(--space-md); font-family:var(--font-heading); color:var(--color-forest);">${item.title}</h2>
                    <p style="color:var(--color-slate); font-size:0.95rem; line-height:1.7; margin-bottom:var(--space-lg);">${item.description}</p>
                    
                    <div style="display:flex; align-items:center; gap:var(--space-md); margin-bottom:var(--space-lg); border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); padding:var(--space-sm) 0;">
                      <img src="${fac.photo}" alt="${fac.name}" style="width:48px; height:48px; border-radius:50%; object-fit:cover;">
                      <div>
                        <span style="font-size:0.75rem; color:var(--color-slate); display:block;">Facilitated by</span>
                        <strong style="color:var(--color-forest); font-size:0.9rem;">${fac.name}</strong>
                      </div>
                    </div>
                  </div>

                  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--space-md); margin-top:auto;">
                    <div>
                      <span style="font-size:0.8rem; color:var(--color-slate); display:block;">Total Rejuvenation Package</span>
                      <strong style="font-size:1.6rem; color:var(--color-forest);">₹${item.price.toLocaleString()}</strong>
                      <span style="font-size:0.75rem; color:var(--color-slate); display:block;">Stays in ${item.roomAllocation}</span>
                    </div>
                    <button class="btn btn-terracotta booking-trigger-btn" data-type="retreat" data-id="${item.id}" id="book-retreat-${item.id}">Reserve Package</button>
                  </div>
                </div>
              </div>

              <!-- Down portion: Schedule & Property description -->
              <div style="background-color:var(--color-sand-light); border-top:1px solid var(--color-border); padding:var(--space-xl); display:grid; grid-template-columns: 1.5fr 1fr; gap:var(--space-xl);">
                <div>
                  <h4 style="font-size:1.1rem; color:var(--color-forest); margin-bottom:var(--space-md); font-family:var(--font-heading);">Standard Retreat Schedule</h4>
                  <div style="display:flex; flex-direction:column; gap:var(--space-sm);">
                    ${item.schedule.map((step, index) => `
                      <div style="display:flex; gap:var(--space-sm); font-size:0.9rem; align-items:start;">
                        <span style="color:var(--color-terracotta); font-weight:700; width:60px; flex-shrink:0;">Step ${index + 1}:</span>
                        <span style="color:var(--color-charcoal);">${step.replace(`Day ${index+1}: `, "")}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div>
                  <h4 style="font-size:1.1rem; color:var(--color-forest); margin-bottom:var(--space-md); font-family:var(--font-heading);">Stay Environment: ${propName}</h4>
                  <p style="font-size:0.85rem; color:var(--color-slate); line-height:1.6; margin-bottom:var(--space-sm);">
                    Property Type: <strong>Boutique Eco Retreat</strong><br>
                    Location: <strong>${db.Properties.find(p => p.id === item.propertyId)?.location}</strong>
                  </p>
                  <p style="font-size:0.85rem; color:var(--color-slate); line-height:1.6; margin:0;">
                    Includes full Ayurvedic consultation, private mineral baths, custom detox meal formulas, and daily yoga shala sessions.
                  </p>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      renderRetreats();
    });
  </script>
</body>
</html>
