<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse therapeutic wellness, clay crafting, and organic culinary experiences in Kerala. Reserve seats led by verified local facilitators.">
  <title>Mindful Experiences in Kerala - Peepal Tree</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main style="padding-top: calc(var(--header-height) + var(--space-xl));">
    <div class="container">
      
      <!-- Page Header -->
      <div style="margin-bottom: var(--space-xl);" class="fade-in-section is-visible">
        <span style="font-size:0.8rem; font-weight:700; color:var(--color-terracotta); text-transform:uppercase;">The Primary Platform Object</span>
        <h1 style="margin: var(--space-xs) 0 var(--space-sm);">Experiences Rooted in Kerala</h1>
        <p style="color:var(--color-slate); max-width:600px;">Tactile gatherings, wellness sessions, and cultural discoveries designed around personal growth, not rapid tourism.</p>
      </div>

      <!-- Filters & Search Toolbar -->
      <div class="fade-in-section is-visible" style="background-color:var(--color-coconut); padding:var(--space-md) var(--space-lg); border-radius:var(--radius-md); border:1px solid var(--color-border); margin-bottom:var(--space-lg);">
        <div style="display:flex; gap:var(--space-md); flex-wrap:wrap; align-items:center; justify-content:between;">
          <!-- Category Filters -->
          <div class="category-filter-nav" style="margin:0; flex:1;" id="experience-categories">
            <button class="category-btn active" data-category="All">All Categories</button>
            <button class="category-btn" data-category="Wellness">Wellness</button>
            <button class="category-btn" data-category="Creativity">Creativity</button>
            <button class="category-btn" data-category="Nature">Nature</button>
            <button class="category-btn" data-category="Food">Food</button>
            <button class="category-btn" data-category="Learning">Learning</button>
          </div>

          <!-- Destination filter & search -->
          <div style="display:flex; gap:var(--space-sm); align-items:center; flex-wrap:wrap;">
            <select id="filter-destination" class="form-select" style="width:160px; padding: 0.5rem var(--space-md); background-color:var(--color-sand-light);">
              <option value="All">All Locations</option>
              <option value="wayanad">Wayanad</option>
              <option value="varkala">Varkala</option>
              <option value="kovalam">Kovalam</option>
              <option value="alleppey">Alleppey</option>
            </select>
            <input type="text" id="search-input" class="form-input" placeholder="Search experiences..." style="width:220px; padding: 0.5rem var(--space-md); background-color:var(--color-sand-light);">
          </div>
        </div>
      </div>

      <!-- Dynamic Experiences Grid -->
      <div class="grid-3" id="experiences-dynamic-grid" style="min-height:400px;">
        <!-- Injected via JavaScript below -->
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

  <!-- Experiences Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const db = window.PeepalDatabase;
      const store = window.PeepalStore;
      const grid = document.getElementById("experiences-dynamic-grid");
      const categoryContainer = document.getElementById("experience-categories");
      const destSelect = document.getElementById("filter-destination");
      const searchInput = document.getElementById("search-input");

      let activeCategory = "All";
      let activeDestination = "All";
      let searchQuery = "";

      // Load query parameters if directed from home links
      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get("id");

      function renderExperiences() {
        if (!db || !grid) return;

        let list = db.Experiences;

        // Apply dynamic filters
        if (activeCategory !== "All") {
          list = list.filter(e => e.category === activeCategory);
        }
        if (activeDestination !== "All") {
          list = list.filter(e => e.destinationId === activeDestination);
        }
        if (searchQuery) {
          list = list.filter(e => 
            e.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
            e.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
            e.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()))
          );
        }

        // If a specific experience ID is queried (e.g. detailed view state)
        if (queryId) {
          list = list.filter(e => e.id === queryId);
        }

        if (list.length === 0) {
          grid.innerHTML = `
            <div style="grid-column: 1/-1; text-align:center; padding:var(--space-xxl) var(--space-md);">
              <h3 style="color:var(--color-sage); margin-bottom:var(--space-sm);">No Experiences Found</h3>
              <p style="color:var(--color-slate);">Try clearing your search query or selecting a different category filter.</p>
              <button class="btn btn-outline" id="clear-filters-btn">Reset All Filters</button>
            </div>
          `;
          document.getElementById("clear-filters-btn")?.addEventListener("click", resetFilters);
          return;
        }

        grid.innerHTML = list.map(item => {
          const isFav = store ? store.isFavorite(item.id) : false;
          const favText = isFav ? "♥" : "♡";
          const favClass = isFav ? "active" : "";
          const destName = db.Destinations.find(d => d.id === item.destinationId)?.name || item.destinationId;

          return `
            <div class="card fade-in-section is-visible" id="exp-card-${item.id}">
              <div class="card-img-wrapper">
                <span class="card-badge">${item.category}</span>
                <button class="card-favorite-btn favorite-toggle-btn ${favClass}" data-id="${item.id}" aria-label="Favorite Experience">
                  <span>${favText}</span>
                </button>
                <img src="${item.gallery[0]}" alt="${item.title}">
              </div>
              <div class="card-content">
                <div class="card-meta">
                  <span>📍 ${destName}</span> &bull; 
                  <span>🕒 ${item.duration}</span>
                </div>
                <h3 class="card-title">${item.title}</h3>
                <p class="card-description">${item.description}</p>
                <div style="margin-bottom:var(--space-md); display:flex; gap:var(--space-xs); flex-wrap:wrap;">
                  ${item.tags.map(t => `<span style="font-size:0.75rem; background-color:var(--color-sand); color:var(--color-forest); padding:2px 8px; border-radius:var(--radius-full); font-weight:500;">#${t}</span>`).join('')}
                </div>
                <div class="card-footer">
                  <div class="card-price">₹${item.price.toLocaleString()} <span>/ seat</span></div>
                  <button class="btn btn-terracotta btn-small booking-trigger-btn" data-type="experience" data-id="${item.id}">Book Seat</button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      function resetFilters() {
        activeCategory = "All";
        activeDestination = "All";
        searchQuery = "";
        
        // Reset inputs
        destSelect.value = "All";
        searchInput.value = "";
        
        categoryContainer.querySelectorAll(".category-btn").forEach(b => {
          b.classList.toggle("active", b.getAttribute("data-category") === "All");
        });

        // Clear query parameters
        if (window.location.search) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }

        renderExperiences();
      }

      // Event bindings
      categoryContainer.addEventListener("click", (e) => {
        const btn = e.target.closest(".category-btn");
        if (!btn) return;
        
        categoryContainer.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        
        activeCategory = btn.getAttribute("data-category");
        renderExperiences();
      });

      destSelect.addEventListener("change", (e) => {
        activeDestination = e.target.value;
        renderExperiences();
      });

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderExperiences();
      });

      // Initialize render
      renderExperiences();
    });
  </script>
</body>
</html>
